<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pose Runner P1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="hud">
      <div class="brand">
        <h1>Neon Pose Runner</h1>
        <p class="brand-sub">Anime Sprint Edition</p>
      </div>
      <div id="conn" class="conn">连接中…</div>
      <div class="meta">
        <span id="gameStatus" class="pill">状态: READY</span>
        <span id="timer" class="pill">时间: --</span>
        <span id="score" class="pill">得分: 0</span>
        <span id="hits" class="pill">命中: 0</span>
        <span id="lane" class="pill">通道: 中</span>
      </div>
      <div class="controls">
        <button id="btnStart" type="button">启动</button>
        <button id="btnPause" type="button">暂停</button>
        <button id="btnResume" type="button">继续</button>
        <button id="btnRestart" type="button">重开</button>
      </div>
      <div class="objective" id="objective">目标: --</div>
      <div class="legend" id="legend">规则: --</div>
      <div class="diag" id="diagPanel">
        <span class="diag-item" id="diagStream">stream: --</span>
        <span class="diag-item" id="diagLatency">input age: --</span>
        <span class="diag-item" id="diagActions">actions: --</span>
        <span class="diag-item" id="diagSource">source: --</span>
      </div>
      <div class="tips">
        先点“启动”；抬左手=左道，抬右手=右道，不抬手约30ms回中。键盘兜底：←/→ 换道，↓ 下蹲。按 F 全屏。
      </div>
    </div>
    <div class="game-shell">
      <canvas id="game" width="1280" height="720"></canvas>
      <div class="scanline"></div>
    </div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
